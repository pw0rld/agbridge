name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release artifacts for (e.g., v0.1.0-phase-b)'
        required: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    name: goreleaser build (6 targets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          # goreleaser derives the version and changelog from tags.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # Packaging (matrix, naming, ldflags, SHA256SUMS) lives in
      # .goreleaser.yaml. Publishing happens in the release job below so
      # versioned notes and helper scripts can be attached, hence
      # --skip=publish here.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser v2 keeps "binary" archives virtual: artifacts.json maps
      # the final name (agbridge-<os>-<arch>[.exe]) onto the raw build
      # directory path without copying. Materialize the renamed files here
      # so the upload glob and the softprops step below stay plain.
      - name: materialize release binaries
        run: |
          jq -r 'map(select(.type=="Binary" and .extra.ID=="binaries"))
                 | .[] | "\(.path)\t\(.name)"' dist/artifacts.json |
          while IFS=$'\t' read -r path name; do
            cp "$path" "dist/$name"
          done
          test "$(find dist -maxdepth 1 -name 'agbridge-*' ! -type d | wc -l)" -eq 6

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/agbridge-*
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: include helper scripts
        run: |
          cp scripts/install.sh        dist/install.sh
          cp scripts/install.ps1       dist/install.ps1
          cp scripts/gateway-setup.sh  dist/gateway-setup.sh

      - name: extend SHA256SUMS with helper scripts
        working-directory: dist
        run: |
          sha256sum install.sh install.ps1 gateway-setup.sh >> SHA256SUMS
          cat SHA256SUMS

      - name: resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "name=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          fi

      - name: find versioned release notes
        id: notes
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          notes=".github/release-notes/${TAG}.md"
          if [ -f "${notes}" ]; then
            echo "path=${notes}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/agbridge-*
            dist/install.sh
            dist/install.ps1
            dist/gateway-setup.sh
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
