name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)release artifacts for (e.g., v0.1.0-phase-a)'
        required: true

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: validate
    name: build ${{ matrix.target.goos }}-${{ matrix.target.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: build binary
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          # CGO_ENABLED=0 makes the binary fully static (no glibc linkage),
          # so it runs on RHEL 8 / Anolis 3 / Aliyun Linux which ship
          # glibc 2.32 — github's ubuntu-latest runner is on glibc 2.35+.
          CGO_ENABLED: "0"
          # Stamp the exact release tag into the binary so `agbridge
          # --version` can never drift from the tag it was cut from
          # (which is what the agbridge-cloud version guard compares).
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          out="agbridge-${GOOS}-${GOARCH}"
          if [ "${GOOS}" = windows ]; then out="${out}.exe"; fi
          go build -trimpath -ldflags="-s -w -X main.agbridgeVersion=${TAG}" -o "${out}" ./cmd/agbridge
          ls -la "${out}"
          file "${out}" || true
          ./"${out}" --version 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: agbridge-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: agbridge-${{ matrix.target.goos }}-${{ matrix.target.goarch }}*
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: include helper scripts
        run: |
          cp scripts/install.sh        dist/install.sh
          cp scripts/install.ps1       dist/install.ps1
          cp scripts/gateway-setup.sh  dist/gateway-setup.sh

      - name: compute SHA256SUMS
        working-directory: dist
        run: |
          ls -la
          # Hash all release assets (binaries + helper scripts) so users
          # can verify integrity for whichever they download.
          sha256sum agbridge-* install.sh install.ps1 gateway-setup.sh > SHA256SUMS
          cat SHA256SUMS

      - name: resolve tag name
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ -n "${INPUT_TAG}" ]; then
            echo "name=${INPUT_TAG}" >> "${GITHUB_OUTPUT}"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "${GITHUB_OUTPUT}"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/agbridge-*
            dist/install.sh
            dist/install.ps1
            dist/gateway-setup.sh
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
